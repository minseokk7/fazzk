<!DOCTYPE html>
<html>
<head>
    <title>Fazzk OBS 자동 연결</title>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .status { 
            font-size: 18px;
            margin-bottom: 20px;
        }
        .loading { 
            color: #00ff88; 
            animation: pulse 2s infinite;
        }
        .error { 
            color: #ff4444; 
        }
        .success { 
            color: #00ff88; 
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            width: 0%;
            transition: width 0.3s ease;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .port-list {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
        .current-port {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 Fazzk OBS 연결</h2>
        <div class="status loading" id="status">🔍 Fazzk 서버 검색 중...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="port-list" id="portInfo"></div>
    </div>
    
    <script>
    let currentPortIndex = 0;
    const ports = [3001, 3000, 3002, 3003, 3004, 3005, 8080, 8081];
    
    async function findFazzkServer() {
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const portInfo = document.getElementById('portInfo');
        
        status.className = 'status loading';
        status.textContent = '🔍 Fazzk 서버 검색 중...';
        
        for (let i = 0; i < ports.length; i++) {
            const port = ports[i];
            currentPortIndex = i;
            
            // 진행률 업데이트
            const progressPercent = ((i + 1) / ports.length) * 100;
            progress.style.width = progressPercent + '%';
            
            status.textContent = `🔍 포트 ${port} 확인 중... (${i+1}/${ports.length})`;
            portInfo.innerHTML = `검색 중인 포트: <span class="current-port">${port}</span>`;
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1500);
                
                const response = await fetch(`http://localhost:${port}/settings`, {
                    method: 'GET',
                    mode: 'cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    // JSON 응답인지 확인
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        redirectToFazzk(port);
                        return;
                    }
                }
            } catch (e) {
                // 포트 사용 불가 또는 타임아웃 - 다음 포트 시도
                continue;
            }
            
            // 각 포트 검사 사이에 짧은 지연
            await new Promise(resolve => setTimeout(resolve, 200));
        }
        
        // 모든 방법 실패
        progress.style.width = '100%';
        status.className = 'status error';
        status.innerHTML = `
            ❌ Fazzk 서버를 찾을 수 없습니다<br><br>
            <strong>해결 방법:</strong><br>
            1. Fazzk 앱이 실행 중인지 확인<br>
            2. 방화벽이 차단하고 있는지 확인<br>
            3. 수동으로 http://localhost:3001/follower 시도<br><br>
            <small>10초 후 자동으로 다시 검색합니다...</small>
        `;
        
        portInfo.textContent = '검색된 포트: 없음';
        
        // 10초 후 재시도
        setTimeout(() => {
            progress.style.width = '0%';
            findFazzkServer();
        }, 10000);
    }
    
    function redirectToFazzk(port) {
        const status = document.getElementById('status');
        const portInfo = document.getElementById('portInfo');
        const progress = document.getElementById('progress');
        
        progress.style.width = '100%';
        status.className = 'status success';
        status.innerHTML = `✅ Fazzk 서버 발견!<br>포트 ${port}에서 연결 중...`;
        portInfo.innerHTML = `발견된 포트: <span class="current-port">${port}</span>`;
        
        // OBS 모드 설정
        window.OBS_MODE = true;
        window.DIRECT_NOTIFIER_MODE = true;
        
        // 캐시 무효화를 위한 타임스탬프 추가
        const timestamp = Date.now();
        
        // 1.5초 후 리다이렉트
        setTimeout(() => {
            window.location.href = `http://localhost:${port}/follower?_t=${timestamp}&obs=1`;
        }, 1500);
    }
    
    // 페이지 로드 시 자동 실행
    findFazzkServer();
    
    // 30초마다 재검색 (연결 실패 시 자동 복구)
    setInterval(() => {
        // 현재 검색 중이 아닐 때만 재검색
        const status = document.getElementById('status');
        if (status.className.includes('error')) {
            findFazzkServer();
        }
    }, 30000);
    </script>
</body>
</html>
