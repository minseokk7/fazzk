<!DOCTYPE html>
<html>
<head>
    <title>Fazzk OBS 연결기</title>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .status { 
            font-size: 18px;
            margin-bottom: 20px;
        }
        .loading { 
            color: #00ff88; 
            animation: pulse 2s infinite;
        }
        .error { 
            color: #ff4444; 
        }
        .success { 
            color: #00ff88; 
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            width: 0%;
            transition: width 0.3s ease;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .port-list {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
        .current-port {
            color: #00ff88;
            font-weight: bold;
        }
        .info-box {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 Fazzk OBS 연결기</h2>
        <div class="status loading" id="status">🔍 Fazzk 서버 검색 중...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="port-list" id="portInfo"></div>
        
        <div class="info-box">
            <strong>📋 사용법:</strong><br>
            1. Fazzk 앱을 먼저 실행하세요<br>
            2. OBS Studio에서 브라우저 소스 추가<br>
            3. 이 HTML 파일을 선택하세요<br>
            4. 자동으로 Fazzk에 연결됩니다!
        </div>
    </div>
    
    <script>
    let currentPortIndex = 0;
    const ports = [3001, 3000, 3002, 3003, 3004, 3005, 8080, 8081, 9000, 9001];
    const hosts = ['127.0.0.1', 'localhost'];
    
    async function findFazzkServer() {
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const portInfo = document.getElementById('portInfo');
        
        status.className = 'status loading';
        status.textContent = '🔍 Fazzk 서버 검색 중...';
        
        const attempts = hosts.flatMap(host => ports.map(port => ({ host, port })));

        for (let i = 0; i < attempts.length; i++) {
            const { host, port } = attempts[i];
            currentPortIndex = i;

            const progressPercent = ((i + 1) / attempts.length) * 100;
            progress.style.width = progressPercent + '%';

            status.textContent = `🔍 ${host}:${port} 확인 중... (${i+1}/${attempts.length})`;
            portInfo.innerHTML = `검색 중인 주소: <span class="current-port">${host}:${port}</span>`;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1500);

                const response = await fetch(`http://${host}:${port}/health`, {
                    method: 'GET',
                    mode: 'cors',
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    const health = await response.json();
                    if (health && health.app === 'fazzk' && health.status === 'ok') {
                        redirectToFazzk(host, port);
                        return;
                    }
                }
            } catch (e) {
                continue;
            }

            await new Promise(resolve => setTimeout(resolve, 200));
        }
        
        // 모든 방법 실패
        progress.style.width = '100%';
        status.className = 'status error';
        status.innerHTML = `
            ❌ Fazzk 서버를 찾을 수 없습니다<br><br>
            <strong>해결 방법:</strong><br>
            1. Fazzk 앱이 실행 중인지 확인<br>
            2. 방화벽이 차단하고 있는지 확인<br>
            3. 바이러스 백신 소프트웨어 확인<br>
            4. 수동으로 http://127.0.0.1:3001/follower 시도<br><br>
            <small>15초 후 자동으로 다시 검색합니다...</small>
        `;
        
        portInfo.textContent = '검색된 포트: 없음';
        
        // 15초 후 재시도
        setTimeout(() => {
            progress.style.width = '0%';
            findFazzkServer();
        }, 15000);
    }
    
    function redirectToFazzk(host, port) {
        const status = document.getElementById('status');
        const portInfo = document.getElementById('portInfo');
        const progress = document.getElementById('progress');
        
        progress.style.width = '100%';
        status.className = 'status success';
        status.innerHTML = `✅ Fazzk 서버 발견!<br>${host}:${port}에서 연결 중...`;
        portInfo.innerHTML = `발견된 주소: <span class="current-port">${host}:${port}</span>`;
        
        // 1.5초 후 리다이렉트
        setTimeout(() => {
            window.location.href = `http://${host}:${port}/follower`;
        }, 1500);
    }
    
    // 페이지 로드 시 자동 실행
    findFazzkServer();
    
    // 30초마다 재검색 (연결 실패 시 자동 복구)
    setInterval(() => {
        // 현재 검색 중이 아닐 때만 재검색
        const status = document.getElementById('status');
        if (status.className.includes('error')) {
            findFazzkServer();
        }
    }, 30000);
    </script>
</body>
</html>
